<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Oltinsimon-sariq (Gold/Amber) gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C185" />
      <stop offset="50%" stop-color="#D7B686" />
      <stop offset="100%" stop-color="#B8935B" />
    </linearGradient>

    <!-- Yumshoq soya effekti -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- ICON SECTION: Uy tomi va Aqlli Texnologiya ramzi -->
    <g id="logo-icon" filter="url(#softShadow)">
      <!-- Tom tepasidagi Wi-Fi/Signal to'lqinlari -->
      <path d="M 370 70 A 35 35 0 0 1 430 70" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 382 84 A 20 20 0 0 1 418 84" fill="none" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="400" cy="96" r="4.5" fill="url(#goldGradient)"/>

      <!-- Cross/X shaklidagi Uy tomi strukturasi -->
      <path d="M 320 165 L 400 95 L 480 165" fill="none" stroke="url(#goldGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 330 172 L 400 110 L 470 172" fill="none" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round"/>

      <!-- Uy ichidagi deraza (4 ta katakcha) -->
      <g transform="translate(390, 135)">
        <rect x="0" y="0" width="8" height="8" rx="1.5" fill="url(#goldGradient)"/>
        <rect x="12" y="0" width="8" height="8" rx="1.5" fill="url(#goldGradient)"/>
        <rect x="0" y="12" width="8" height="8" rx="1.5" fill="url(#goldGradient)"/>
        <rect x="12" y="12" width="8" height="8" rx="1.5" fill="url(#goldGradient)"/>
      </g>

      <!-- Pastki egilgan chiziq (Base Curve) -->
      <path d="M 330 188 Q 400 208 470 188" fill="none" stroke="url(#goldGradient)" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- MIDDLE SCRIPT TEXT: "Smart Appliances" (Kalligrafiya uslubida, oq rang) -->
    <text x="400" y="255"
          text-anchor="middle"
          font-family="'Playfair Display', 'Brush Script MT', 'Great Vibes', cursive"
          font-size="36"
          font-style="italic"
          fill="#FFFFFF"
          filter="url(#softShadow)">
      Smart Appliances
    </text>

    <!-- MAIN BRAND TEXT: "TECHHOME" (Katta oltinsimon shriftda) -->
    <text x="400" y="340"
          text-anchor="middle"
          font-family="'Cinzel', 'Times New Roman', 'Georgia', serif"
          font-size="64"
          font-weight="700"
          letter-spacing="6"
          fill="url(#goldGradient)"
          filter="url(#softShadow)">
      TECHHOME
    </text>
  </g>
</svg>
