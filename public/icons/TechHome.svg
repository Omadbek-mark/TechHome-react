<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <!-- Gradientlar -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7B686" />
      <stop offset="100%" stop-color="#F2D8B0" />
    </linearGradient>
  </defs>

  <!-- Logo Belgisi (Icon) -->
  <g transform="translate(10, 5)">
    <!-- Uy konturi -->
    <path d="M 25,6 L 45,22 L 45,44 C 45,46.2 43.2,48 41,48 L 9,48 C 6.8,48 5,46.2 5,44 L 5,22 Z"
          fill="none"
          stroke="url(#techGrad)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Aqlli texnologiya (Wi-Fi/Signal simvol) -->
    <path d="M 16,28 A 12,12 0 0,1 34,28"
          fill="none"
          stroke="url(#techGrad)"
          stroke-width="3"
          stroke-linecap="round" />

    <path d="M 20,34 A 7,7 0 0,1 30,34"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="2.5"
          stroke-linecap="round" />

    <!-- Quvvat / Boshqaruv nuqtasi -->
    <circle cx="25" cy="40" r="2.5" fill="url(#accentGrad)" />
  </g>

  <!-- Logo Matni (TechHome) -->
  <text x="68" y="38" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Tech</tspan>
    <tspan fill="url(#accentGrad)">Home</tspan>
  </text>

  <!-- Kichik Tagline (Smart Appliances) -->
  <text x="69" y="50" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="400" fill="#D5D5D5" letter-spacing="1.5">
    SMART APPLIANCES
  </text>
</svg>
