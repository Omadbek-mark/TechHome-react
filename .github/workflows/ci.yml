name: Frontend CI
on:
  pull_request:
  push:
    branches: [develop, master, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VITE_API_URL: https://api.techhome.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test --run
      - run: yarn build
      - run: docker build --build-arg VITE_API_URL -t techhome-frontend:ci .
      - run: docker run --rm --entrypoint nginx techhome-frontend:ci -t

  deploy:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      COOLIFY_URL: https://coolify.oasisspace.org
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: rqqbm9eujtdsh7fgpowo1h0s
      SMOKE_URL: https://techhome.uz/health
    steps:
      - uses: actions/checkout@v4
      - name: Deploy verified commit and check production health
        run: bash .github/scripts/coolify-deploy.sh
